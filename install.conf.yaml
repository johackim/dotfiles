- defaults:
    link:
      create: true

- clean: ['~', '~/.config']

- link:
    ~/.aliases: .aliases
    ~/.dir_colors: .dir_colors
    ~/.gitconfig: .gitconfig
    ~/.gitignore_global: .gitignore_global
    ~/.keynavrc: .keynavrc
    ~/.tmux: .tmux
    ~/.tmux.conf: .tmux.conf
    ~/.urxvt: .urxvt
    ~/.Xresources: .Xresources
    ~/.config/dunst: .config/dunst
    ~/.config/mpv: .config/mpv
    ~/.config/ncdu: .config/ncdu
    ~/.config/ncspot/config.toml: .config/ncspot/config.toml
    ~/.config/nvim/init.vim: .config/nvim/init.vim
    ~/.config/polybar: .config/polybar
    ~/.config/wpg/wpg.conf: .config/wpg/wpg.conf
    ~/.config/yamllint/config: .config/yamllint/config
    ~/.config/zsh: .config/zsh
    ~/.config/gtk-3.0/settings.ini:
      force: true
      path: .config/gtk-3.0/settings.ini
    ~/.config/gtk-4.0/settings.ini:
      force: true
      path: .config/gtk-4.0/settings.ini
    ~/.config/i3:
      force: true
      path: .config/i3
    ~/.config/Thunar/uca.xml:
      force: true
      path: .config/Thunar/uca.xml
    ~/.local/bin:
      force: true
      glob: true
      path: .local/bin/*.sh
    ~/.gtkrc-2.0:
      force: true
      path: .gtkrc-2.0
    ~/.xinitrc:
      force: true
      path: .xinitrc
    ~/.zshrc:
      force: true
      path: .zshrc
